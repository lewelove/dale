[workspace]

members = [
  "core/libdale",
  "core/dale",
  "actions/rust/libactions",
  "actions/rust/calculate_cover_metrics",
  "actions/rust/collect",
  "actions/rust/embed",
  "actions/rust/musicbrainz_fetch",
  "actions/rust/theme",
]

resolver = "2"

[workspace.lints.clippy]

all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }

struct_excessive_bools = "allow"
cargo_common_metadata = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

cognitive_complexity = "deny"
fn_params_excessive_bools = "deny"

[workspace.dependencies]

libdale = { path = "core/libdale" }
libactions = { path = "actions/rust/libactions" }

alphanumeric-sort = "1.5.5"
anyhow = "1.0.103"
axum = { version = "0.8.8", features = ["ws"] }
base64 = "0.22.1"
blake3 = "1.8.5"
chrono = "0.4.45"
clap = { version = "4.4", features = ["derive"] }
dirs = "6.0.0"
discogs-rs = "0.1.0"
dotenv-ng-core = "1.0.0"
fast_image_resize = "6.0.0"
futures = "0.3.31"
image = "0.25.9"
indexmap = { version = "2.13.0", features = ["serde"] }
indicatif = "0.18.4"
kmeans_colors = "0.7.1"
lofty = "0.25.2"
log = "0.4.29"
mlua = { version = "0.12.0", features = ["luajit", "serialize", "vendored"] }
mpd_client = "1.4.1"
notify = "8.2.0"
palette = "0.7.6"
qoi = "0.4.1"
rand = "0.10.0"
rayon = "1.10.0"
regex = "1.13.0"
reqwest = { version = "0.13.4", features = ["json"] }
roaring = "0.11.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
simple_logger = "5.1.0"
tempfile = "3.17.1"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
toml = { version = "1.0.1", features = ["preserve_order"] }
tower-http = { version = "0.6.8", features = ["cors", "fs", "trace"] }
urlencoding = "2.1.3"
walkdir = "2.4"
xxhash-rust = { version = "0.8.15", features = ["xxh64"] }
